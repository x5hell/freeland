# y2be — лицо на Netlify (статика здесь, всё тяжёлое на origin).
# Проксируем только /api и /img: сегменты HLS, очередь, картинки.
# /admin НЕ проксируется — админка origin недоступна через лицо.
# Origin сейчас в открытом режиме (после отката с Vercel секрета нет);
# когда вернём ORIGIN_SECRET — добавить сюда headers = {X-Origin-Secret = "..."}.

[[redirects]]
  from = "/api/*"
  to = "https://y2be.duckdns.org/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/img/*"
  to = "https://y2be.duckdns.org/img/:splat"
  status = 200
  force = true
